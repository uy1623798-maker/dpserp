    <linearGradient id="orange" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffad08"/><stop offset="1" stop-color="#ffc21c"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff3658"/><stop offset="1" stop-color="#ff2d55"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#209fef"/><stop offset="1" stop-color="#48caec"/></linearGradient>
